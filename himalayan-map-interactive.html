<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOEP Interactive Himalayan Map</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f5;
            overflow-x: hidden;
        }

        .map-container {
            position: relative;
            width: 100%;
            margin: 0px;
            padding: 0px;
            opacity: 0;
            animation: fadeIn 1s ease-out forwards;
            overflow: hidden;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        .map-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 64.77%; /* Aspect ratio of the map */
            background: #e0e0e0;
            // border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .map-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transition: transform 0.3s ease;
        }

        /* Overlay for dimming effect */
        .map-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(circle at var(--x, 50%) var(--y, 50%), 
                transparent 0%, 
                transparent 0%, 
                transparent 0%, 
                transparent 0%, 
                transparent 0%, 
                transparent 0%, 
                transparent 0%, 
                transparent 0%, 
                rgba(0, 0, 0, 0.6) 45%);
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .ladakh-arunachal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transition: opacity 0.5s ease;
            opacity: 0;
        }

        .ladakh-arunachal-overlay.active {
            opacity: 80%;
        }

        .map-overlay.active {
            opacity: 1;
        }

        /* Pin Styles */
        .pin {
            position: absolute;
            width: 60px;
            height: 60px;
            transform: translate(-50%, -50%);
            cursor: pointer;
            z-index: 10;
            transition: transform 0.3s ease;
            outline: none;
        }

        .pin:hover {
            transform: translate(-50%, -50%) scale(1.15);
        }

        .pin:focus {
            outline: 3px solid rgba(220,50,50,0.6);
            outline-offset: 2px;
            border-radius: 50%;
            transition: outline 0.2s ease;
        }

        .pin.force-focus {
            outline: 3px solid rgba(220,50,50,0.6);
            outline-offset: 2px;
            border-radius: 50%;
            transition: outline 0.2s ease;
        }

        /* Thunder Dragon Icon*/
        .thunder-dragon {
            width: 70%;
            height: 70%;
            position: relative;
            left: 13%;
            top: 10%;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
            }
            50% {
                transform: scale(1.05);
                filter: drop-shadow(0 2px 8px rgba(255, 195, 0, 0.6));
            }
        }

        /* Info Panel Styles (replacing legend) */
        .map-info-panel {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 16px;
            width: 320px;
            max-width: calc(100% - 40px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
            z-index: 5;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            transform-origin: bottom right;
            position: absolute;
            left: 20px;
            bottom: 20px;

        }

        .info-panel-partner {
            opacity: 0;
            display: block;
            font-size: 16px;
            font-weight: 600;
            /*
            position: absolute;
            left:auto;
            right: 20px;
            bottom: 20px;
            */
            width: auto;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0);
        }

        .info-panel-partner.active {
            opacity: 1;
        }

        .info-panel-partner-image {
            width: auto;
            height: 50px;
        }

        .info-panel-partner-title {
            margin-bottom: 0;
            margin-right: 20px;
            font-size: 18px;
            color: #333333;
            margin-top: 5px;
        }

        .flex-outer {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .flex-vertical {
            flex-direction: column;
        }

        .flex-horizontal {
            flex-direction: row;
        }

        .map-info-panel-ladakh {
          position: absolute;
          bottom: 20px;
          left: 20px;
        }

        .map-info-panel-uttarakhand {
          position: absolute;
          bottom: 20px;
          left: 20px;
        }

        .map-info-panel-nepal {
          position: absolute;
          bottom: 20px;
          left: 20px;
        }

        .map-info-panel-bhutan {
          position: absolute;
          bottom: 20px;
          left: 20px;
        }

        .map-info-panel-arunachal {
          position: absolute;
          bottom: 20px;
          left: 20px;
        }

        .info-panel-prompt {
            display: none;
            text-align: center;
            color: #666;
            font-size: 14px;
            padding: 20px 0;
        }

        .info-panel-prompt svg {
            width: 40px;
            height: 40px;
            margin-bottom: 8px;
            opacity: 0.3;
            animation: pulse 2s ease-in-out infinite;
        }

        .info-panel-content {
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
        }

        .info-panel-content a {
            color: #1a73e8;
        }

        .info-panel-content.active {
            opacity: 1;
            transform: translateY(0);
        }

        .info-panel-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 12px;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .info-panel-image.halfsize {
            width: 48%;
            height: 150px;
            margin-right: 2%;
            margin-left: 2%;
        }

        .info-panel-image.loaded {
            opacity: 1;
        }

        .info-panel-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            text-align: center;
        }

        .td-left {
            /* text-align: left; */
            width: 48%;
        }

        .td-right {
            /* text-align: right; */
            width: 52%;
            padding-left: 4%;
        }

        .info-panel-details {
            font-size: 14px;
            color: #666;
            line-height: 1.5;
        }

        .info-panel-details ul {
            margin: 8px 0;
            padding-left: 20px;
        }

        .info-panel-details li {
            margin: 4px 0;
        }

        /* Remove old tooltip styles */
        .tooltip {
            display: none;
        }

        /* Enhanced pin hover state */
        .pin.active {
            transform: translate(-50%, -50%) scale(1.2);
            z-index: 11;
        }

        .pin.active .thunder-dragon {
            filter: drop-shadow(0 4px 12px rgba(255, 195, 0, 0.8));
        }

        /* Mobile Styles */
        @media (max-width: 768px) {
            .map-container {
                padding: 10px;
                margin: 20px auto;
            }

            .pin {
                width: 40px;
                height: 40px;
            }

            .tooltip {
                min-width: 250px;
                max-width: 280px;
                padding: 12px;
            }

            .tooltip-image {
                height: 100px;
            }

            .map-legend {
                bottom: 10px;
                right: 10px;
                padding: 8px;
            }

            .legend-title {
                font-size: 11px;
            }

            .legend-item {
                font-size: 12px;
                padding: 3px 6px;
            }
        }

        /* Touch device indicator */
        .touch-hint {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 15;
            pointer-events: none;
        }

        .touch-hint.show {
            opacity: 1;
        }

        /* Loading skeleton for images */
        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }

        @keyframes loading {
            0% {
                background-position: 200% 0;
            }
            100% {
                background-position: -200% 0;
            }
        }
    </style>
</head>

            resizeMapContainer() {
                console.log("Everything is loaded — DOM, images, iframes, fonts");
                const mapContainer = document.getElementById("map-container");
                const mapWrapper = document.getElementById("map-wrapper");
                const ratio = 0.6477; // height / width ratio of the map image
                if (window.innerHeight / window.innerWidth >= ratio) {
                    mapContainer.style.width = `${window.innerWidth}px`;
                    mapContainer.style.height = `${window.innerWidth * ratio}px`;
                    mapWrapper.style.width = `${window.innerWidth}px`;
                    mapWrapper.style.height = `${window.innerWidth * ratio}px`;
                }
                else {
                    mapContainer.style.height = `${window.innerHeight}px`;
                    mapContainer.style.width = `${window.innerHeight / ratio}px`;
                    mapWrapper.style.height = `${window.innerHeight}px`;
                    mapWrapper.style.width = `${window.innerHeight / ratio}px`;
                }
                mapContainer.style.left = `${(window.innerWidth - mapContainer.offsetWidth) / 2}px`;

                const mapInfoPanel = document.querySelector('.map-info-panel');
                mapInfoPanel.style.transform = `scale(${mapContainer.offsetWidth / 1100.0})`;
                mapInfoPanel.style.transformOrigin = "bottom left";

                /*

                mapPartnerPanel.style.transform = `scale(${mapContainer.offsetWidth / 1100.0})`;
                mapPartnerPanel.style.transformOrigin = "bottom right";
                */

                const pins = document.querySelectorAll('.pin');
                pins.forEach(pin => {
                    pin.style.transform = `translate(-50%, -50%) scale(${mapContainer.offsetWidth / 1100.0})`;
                });

                // Special case for mobile
                // get url param "mobile"
                const urlParams = new URLSearchParams(window.location.search);
                let isMobile = urlParams.get('mobile');
                if (isMobile && isMobile.trim()) {
                    isMobile = isMobile.trim().toLowerCase();
                }
                if (isMobile === "yes") {
                    const currentMapWidth = mapContainer.offsetWidth;
                    const newMapWidth = currentMapWidth * 1.5;
                    const newMapHeight = newMapWidth * ratio;

                    console.log("ratio: " + (newMapWidth / newMapHeight));
                    mapContainer.style.height = `${newMapHeight}px`;
                    mapContainer.style.margin = "0";
                    mapContainer.style.padding = "0";
                    mapWrapper.style.height = `${newMapHeight}px`
                    mapWrapper.style.width = `${newMapWidth}px`
                    mapWrapper.style.left = `-${currentMapWidth / 4}px`;
                    mapContainer.style.overflow = "hidden";

                    pins.forEach(pin => {
                        pin.style.transform = `translate(-50%, -50%) scale(${newMapWidth * 2 / 1100.0})`;
                        pin.style.outline = "none";
                    });

                    // Want to show only the centre half of the map
                    mapInfoPanel.style.transform = `scale(${newMapHeight * 1.9 / 1100.0})`;
                    let left = `calc(50% - ${0.5 * mapInfoPanel.getBoundingClientRect().width * (newMapHeight * 1.9 / 1100)}px)`
                    mapInfoPanel.style.left = left;
                    mapInfoPanel.style["z-index"] = "5000";

                    document.querySelector("html").style.overflow = "hidden";

                    // mapInfoPanel.style.transformOrigin = "bottom left";
                }
            }
            init() {
                // Show touch hint on mobile
                if (this.isTouchDevice) {
                    setTimeout(() => {
                        this.touchHint.classList.add('show');
                        setTimeout(() => {
                            this.touchHint.classList.remove('show');
                        }, 3000);
                    }, 1000);
                }

                // Setup event listeners for pins
                this.pins.forEach(pin => {
                    // Desktop hover events
                    if (!this.isTouchDevice) {
                        pin.addEventListener('mouseenter', (e) => this.showLocationInfo(e.currentTarget));
                        pin.addEventListener('mouseleave', () => this.hideLocationInfo());
                        pin.addEventListener('mousemove', (e) => this.showLocationInfo(null, e));
                    }
                    
                    // Mobile tap events
                    pin.addEventListener('click', (e) => {
                        e.stopPropagation();
                        if (this.isTouchDevice) {
                            if (this.activePin === e.currentTarget) {
                                this.hideLocationInfo();
                            } else {
                                this.showLocationInfo(e.currentTarget);
                            }
                        }
                    });

                    // Keyboard accessibility
                    pin.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter' || e.key === ' ') {
                            e.preventDefault();
                            this.showLocationInfo(e.currentTarget);
                        }
                    });

                    pin.addEventListener('blur', () => {
                        if (!this.isTouchDevice) {
                            this.hideLocationInfo();
                        }
                    });
                });

                // Close info panel when clicking outside on mobile
                // if (this.isTouchDevice) {
                // Doing it for all devices
                document.addEventListener('click', (e) => {
                    if (!e.target.closest('.pin')) {
                        this.hideLocationInfo(true);
                    }
                });
                // }

                // Add parallax effect on desktop
                if (!this.isTouchDevice) {
                    // this.addParallaxEffect();
                }

              const firstPin = document.getElementsByClassName("pin")[0];
              this.showLocationInfo(firstPin);
              this.hideLocationInfo(true);
            }

            showDimmingOverlay(pin, second = false) {
                const rect = pin.getBoundingClientRect();
                const containerRect = pin.closest('.map-wrapper').getBoundingClientRect();
                const x = ((rect.left - containerRect.left + rect.width / 2) / containerRect.width) * 100;
                const y = ((rect.top - containerRect.top + rect.height / 2) / containerRect.height) * 100;
                
                this.overlay.style.setProperty('--x', `${x}%`);
                this.overlay.style.setProperty('--y', `${y}%`);
                this.overlay.classList.add('active');
            }

            showLocationInfo(pin, event) {
                if (!pin) {
                  // If no pin is provided, use the event target rectangle
                  // and pin bounding rectangles to get active pin
                  if (event) {
                    const targetRect = event.target.getBoundingClientRect();
                    window.lastTargetRect = targetRect;
                    this.pins.forEach(p => {
                      const rect = p.getBoundingClientRect();
                      if (rect.left <= targetRect.right && rect.right >= targetRect.left &&
                          rect.top <= targetRect.bottom && rect.bottom >= targetRect.top) {
                        pin = p;
                      }
                    });
                  }
                }

                if (this.activePin) {
                    this.activePin.classList.remove('active');
                }

                // Set active pin
                this.activePin = pin;
                pin.classList.add('active');
                this.infoPanel.classList.add(`map-info-panel-${pin.dataset.location}`);

                // Get location data
                const location = pin.dataset.location;
                const data = this.locationData[location];

                // Update info panel content
                const image = this.infoPanelContent.querySelector('.info-panel-image');
                const title = this.infoPanelContent.querySelector('.info-panel-title');
                const details = this.infoPanelContent.querySelector('.info-panel-details');

                const logo = {
                    title: document.querySelector('.info-panel-partner-title'),
                    img: document.querySelector('.info-panel-partner img')
                };

                title.textContent = data.title;
                details.innerHTML = data.details;

                // Load image
                if (image.src !== data.image) {
                    image.classList.remove('loaded');
                    image.classList.add('skeleton');
                    const tempImg = new Image();
                    tempImg.onload = () => {
                        image.src = data.image;
                        image.alt = data.title;
                        image.classList.remove('skeleton');
                        image.classList.add('loaded');
                    };
                    tempImg.src = data.image;
                }

                // Load Logo
                if (data.partnerName?.length > 0)
                {
                    logo.title.style.display = "block";
                    logo.title.textContent = data.partnerName;
                }
                else {
                    logo.title.textContent = "";
                    logo.title.style.display = "none";
                }
                logo.img.src = data.partnerLogo;


                // Hide prompt and show content
                this.infoPanel.style.display = "block";
                this.infoPanelPrompt.style.display = 'none';
                this.infoPanelContent.style.display = 'block';
                setTimeout(() => {
                    this.infoPanelContent.classList.add('active');
                    document.querySelector(".info-panel-partner").classList.add('active');
                }, 10);

                // Show dimming overlay
                this.showDimmingOverlay(pin);

                // put pin into focus
                pin.focus();

                // If Laadkh or Arunachal, show the other one too
                if (pin.dataset.location === "ladakh") {
                    // Show Arunachal too
                    const arunachalPin = document.querySelector('.pin[data-location="arunachal"]');
                    arunachalPin.classList.add('force-focus');
                    this.overlay.classList.remove('active');
                    this.ladakhArunachalOverlay.classList.add('active');
                }
                else if (pin.dataset.location === "arunachal") {
                    // Show Ladakh too
                    const ladakhPin = document.querySelector('.pin[data-location="ladakh"]');
                    ladakhPin.classList.add('force-focus');
                    this.overlay.classList.remove('active');
                    this.ladakhArunachalOverlay.classList.add('active');
                }
                else {
                    // remove force-focus from all pins
                    document.querySelectorAll('.pin').forEach(p => p.classList.remove('force-focus'));
                    this.ladakhArunachalOverlay.classList.remove('active');
                }

                const image2 = this.infoPanelContent.querySelector('.info-panel-image.image2');
                if (pin.dataset.location === "nepal") {
                    image2.src = this.locationData.nepal.image2;
                    image2.alt = this.locationData.nepal.title;
                    image2.style.display = "block";
                    image2.classList.remove('skeleton');
                    image2.classList.add('loaded');
                    image.classList.add('halfsize');
                    image2.classList.add('halfsize');
                    title.classList.add('middle');
                }
                else {
                    image2.style.display = "none";
                    image2.classList.remove('loaded');
                    image.classList.remove('halfsize');
                    title.classList.remove('middle');
                }
            }

            hideLocationInfo(hideAll) {
                // Check if the mouse is on active pin
                if (this.activePin) {
                    this.activePin.classList.remove('active');
                    this.activePin.classList.remove('force-focus');
                    this.activePin = null;
                }

                // Hide content and show prompt
                if (hideAll) {
                  this.infoPanelContent.classList.remove('active');
                  document.querySelector(".info-panel-partner").classList.remove('active');
                  document.querySelectorAll('.pin').forEach(p => p.classList.remove('force-focus'));
                  setTimeout(() => {
                      this.infoPanelContent.style.display = 'none';
                      this.infoPanelPrompt.style.display = 'none';
                      this.infoPanel.style.display = "none";
                  }, 300);
                  
                    // Hide overlay
                    this.overlay.classList.remove('active');
                    this.ladakhArunachalOverlay.classList.remove('active');
                }

            }

            addParallaxEffect() {
                const mapImage = document.querySelector('.map-image');
                const mapWrapper = document.querySelector('.map-wrapper');
                
                mapWrapper.addEventListener('mousemove', (e) => {
                    const rect = mapWrapper.getBoundingClientRect();
                    const x = (e.clientX - rect.left) / rect.width;
                    const y = (e.clientY - rect.top) / rect.height;
                    
                    const moveX = (x - 0.5) * 10;
                    const moveY = (y - 0.5) * 10;
                    
                    mapImage.style.transform = `scale(1.05) translate(${moveX}px, ${moveY}px)`;
                });

                mapWrapper.addEventListener('mouseleave', () => {
                    mapImage.style.transform = 'scale(1) translate(0, 0)';
                });
            }
        }

        // Initialize when DOM is ready
        document.addEventListener('DOMContentLoaded', () => {
            new InteractiveMap();
        });
    </script>
</body>
